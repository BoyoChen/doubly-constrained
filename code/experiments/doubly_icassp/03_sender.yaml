# Publication bundle: existing settings; no dispatch on creation.
experiment_name: paper_doubly_sender
shared_settings: {}
sub_experiments:
- description:
    main: MNIST shared-checkpoint sender decision mechanism with native interventions.
    question: Which sender neurons support decisions, and does root pre change their distribution or causal
      necessity?
    subexp: Train and save exactly one shared epoch-one checkpoint per seed, with immediate zero-learning interventions.
  data:
    dataset_name: MNIST
    batch_size: 200
    label_perm: false
    use_DoG: true
    cache_transforms: true
    cache_dtype: float32
    DoG_settings:
      on_off_rate: 1.0
      normalize: true
      kernel_specs:
      - kernel_size: 3
        sigma_center: 0.3333333333333333
        sigma_surround: 0.6666666666666666
      - kernel_size: 3
        sigma_center: 0.6666666666666666
        sigma_surround: 0.3333333333333333
      - kernel_size: 7
        sigma_center: 0.7777777777777778
        sigma_surround: 1.5555555555555556
      - kernel_size: 7
        sigma_center: 1.5555555555555556
        sigma_surround: 0.7777777777777778
      - kernel_size: 13
        sigma_center: 1.4444444444444444
        sigma_surround: 2.888888888888889
      - kernel_size: 13
        sigma_center: 2.888888888888889
        sigma_surround: 1.4444444444444444
  training_settings:
    max_epoch: 1
    min_epoch: 0
    sleep_freq: 99999
    evaluate_freq: 1
    STDP_interval: 1
    stdp_update_mode: two_pass_decision_contingent
    simulation_forward_mode: streaming
    save_best_model: false
    save_final_model: true
    evaluation_level: 3
    evaluation_phases:
    - valid
    - test
    final_evaluation_phases:
    - valid
    - test
    training_schedule:
      enabled: true
      stages:
      - start_epoch: 2
        frozen_cortex_ids:
        - A-1
    diagnostic_settings:
      readout: false
      ablation_chart: false
      singular_value_spectrum: false
      top_maps_plot: false
      confusion_matrix: true
      cortex_statistics: true
      sample_activity_images: false
      temporal_sample_metrics: true
      sample_activity_phases:
      - valid
      - test
      hinge_temporal_metrics: true
      hinge_temporal_phases:
      - valid
      - test
      gpu_usage: true
      model_shape: true
      kernel_heatmaps: false
      readout_fusion: false
      readout_error_overlap: false
      threshold_distribution: true
      per_neuron_activity: true
      per_neuron_activity_phases:
      - valid
      - test
      per_neuron_activity_max_batches: 30
      training_invariant_audit:
        cortex_ids:
        - A-1
        - A
        root_cortex_id: A
        audit_root_direct: true
        audit_root_branch: false
      normalization_mechanism_artifacts: false
      normalization_mechanism_trajectory_epochs:
      - 100
      normalization_mechanism_trajectory_phases:
      - valid
      - test
      normalization_mechanism_artifact_micro_batch_size: 20
      normalization_mechanism_save_full_weight: false
      sender_decision_study:
        epochs:
        - 1
        common_prefix_epoch: 1
        phases:
        - valid
        - test
        samples_per_class: 20
        micro_batch_size: 8
        deletion_fraction: 0.1
        mask_seed: 849
    readout_params:
      weight_decay: 0.0001
      optimizer: lbfgs
      max_iter: 200
      lr: 0.001
      epochs: 0
    evaluation_micro_batch_size: 200
  model:
    first_spike_delay_factor: null
    mean_spike_delay_factor: null
    target_mean_earliness:
      min_target_earliness: 0.03625
      max_target_earliness: 0.03625
    cortex_spec:
      PCA_cortex_settings:
        PCA_settings:
          leave_out_num: 2
          method: PCA
          normalizing: true
          remained_variance: 1
          transpose: false
        new_cortex_split_ratio: 1
        refund_with_amplifier: true
        regularize_afterward: false
        split_only_tail: true
        weight_refund: true
      STDP_cortex_settings:
        init_D_P_rate_ratio: 0.7
        init_P_rate: 1.0e-06
        learning_rate_decrease_base: 0
      base_cortex_settings:
        amplifier_settings:
          log_amplifier_delta: 6.25e-06
          log_amplifier_delta_by_cortex:
            A: 1.25e-06
          target_mean_first_spike_earliness_by_cortex:
            A: 0.38
          lower_bound: 1.0e-05
          upper_bound: 999999999
        kernel_settings:
          init_mean: 0.8
          init_std: 0.05
          minimal_weight: 5.5e-05
          no_skip_links: true
          non_negative_weights: false
          normalize_settings:
            dim_0_freq: 1
            dim_1_freq: 0
            freq_diff: 0
            norm_p: 1
            out_weight_len: 1
            use_shape_ratio: true
            dim_1_mode: per_sender
        lateral_inhibition:
          factor: 3.0
          power: 1.0
        top_k: 4
      neuron_vectors_spec:
        potential_decay_rate: 1.0
        reset_state: 0
        resting_length: 999
        threshold_settings:
          homeostasis_ema_decay: 0.0
          log_thresholds_delta: 0.00125
          lower_bound: 0.1
          upper_bound: 10.0
          target_mean_first_spike_factor_by_cortex:
            A: 0.075
      spike_trace_settings:
        balanced_spike_trace: true
        spike_decay_rate: 0.66
    image_encoder_spec:
      encoder: rank_order
      simulation_time: 40
      end_score_search_steps: 16
    init_cortex:
      fix_shape: true
      input_channel: 6
      kernel_size: 28
      output_channel: 10
      stride: 4
      init_amplifier: 1
      competition_group_N: 20
      pooling_settings:
        mode: max
        kernel_size: global
      subcortexs:
      - fix_shape: true
        input_channel: 6
        kernel_size: 10
        output_channel: 300
        stride: 2
        pooling_settings:
          mode: max
          kernel_size: 2
    remember_settings:
      STDP_mechanism:
        label_usage: signed_ltp
        label_propagating: false
        hinge_softmax_label:
          margin: 0.3
          label_scope: class_aggregate
          positive_scale: 40.0
          negative_scale: 120.0
          wrong_background_value: 0.0
          softmax_temperature: 0.25
          correct_background_value: 0.0
      self_cleaning_after_STDP: false
  sub_exp_name: mnist_shared_prefix_e1
  seed:
  - 40500
  - 40501
  - 40502
  - 40503
- description:
    main: Ex849 adaptive sender removal without threshold division in support scoring.
    question: Does adaptive Doubly sender-specific decision dependence persist without receiver-threshold normalization
      of support?
    subexp: Load the shared epoch-one checkpoint; train nine more epochs through global epoch ten with post
      root normalization, adaptive root threshold/amplifier and frozen upstream features. Rank sender support
      without threshold division; retain receiver-earliness weighting and evaluate the threshold-normalized
      reference on the same model. Save the final checkpoint.
  data:
    dataset_name: MNIST
    batch_size: 200
    label_perm: false
    use_DoG: true
    cache_transforms: true
    cache_dtype: float32
    DoG_settings:
      on_off_rate: 1.0
      normalize: true
      kernel_specs:
      - kernel_size: 3
        sigma_center: 0.3333333333333333
        sigma_surround: 0.6666666666666666
      - kernel_size: 3
        sigma_center: 0.6666666666666666
        sigma_surround: 0.3333333333333333
      - kernel_size: 7
        sigma_center: 0.7777777777777778
        sigma_surround: 1.5555555555555556
      - kernel_size: 7
        sigma_center: 1.5555555555555556
        sigma_surround: 0.7777777777777778
      - kernel_size: 13
        sigma_center: 1.4444444444444444
        sigma_surround: 2.888888888888889
      - kernel_size: 13
        sigma_center: 2.888888888888889
        sigma_surround: 1.4444444444444444
  training_settings:
    max_epoch: 9
    min_epoch: 0
    sleep_freq: 99999
    evaluate_freq: 2
    STDP_interval: 1
    stdp_update_mode: two_pass_decision_contingent
    simulation_forward_mode: streaming
    save_best_model: false
    save_final_model: true
    evaluation_level: 3
    evaluation_phases:
    - valid
    - test
    final_evaluation_phases:
    - valid
    - test
    training_schedule:
      enabled: true
      stages:
      - start_epoch: 2
        frozen_cortex_ids:
        - A-1
        kernel_normalization:
          A:
            dim_0_freq: 1
            dim_1_freq: 0
            freq_diff: 0
            norm_p: 1
            out_weight_len: 1
            use_shape_ratio: true
            dim_1_mode: per_sender
    diagnostic_settings:
      readout: false
      ablation_chart: false
      singular_value_spectrum: false
      top_maps_plot: false
      confusion_matrix: true
      cortex_statistics: true
      sample_activity_images: false
      temporal_sample_metrics: true
      sample_activity_phases:
      - valid
      - test
      hinge_temporal_metrics: true
      hinge_temporal_phases:
      - valid
      - test
      gpu_usage: true
      model_shape: true
      kernel_heatmaps: false
      readout_fusion: false
      readout_error_overlap: false
      threshold_distribution: true
      per_neuron_activity: true
      per_neuron_activity_phases:
      - valid
      - test
      per_neuron_activity_max_batches: 30
      training_invariant_audit:
        cortex_ids:
        - A-1
        - A
        root_cortex_id: A
        audit_root_direct: true
        audit_root_branch: false
      normalization_mechanism_artifacts: false
      normalization_mechanism_trajectory_phases:
      - valid
      - test
      normalization_mechanism_artifact_micro_batch_size: 20
      normalization_mechanism_save_full_weight: false
      sender_decision_study:
        epochs:
        - 2
        - 10
        common_prefix_epoch: 1
        phases:
        - valid
        - test
        samples_per_class: 20
        micro_batch_size: 8
        deletion_fraction: 0.1
        mask_seed: 849
        support_normalization: none
        reference_support_normalization: threshold
    readout_params:
      weight_decay: 0.0001
      optimizer: lbfgs
      max_iter: 200
      lr: 0.001
      epochs: 0
    evaluation_micro_batch_size: 200
    epoch_offset: 1
  model:
    load_from:
      experiment_name: paper_doubly_sender
      sub_exp_name: mnist_shared_prefix_e1_seed{seed}
